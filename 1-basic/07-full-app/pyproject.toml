[project]
name = "agent-platform-agent"
version = "0.1.0"
description = "Competitive research agent on Strands Agents + Bedrock AgentCore Runtime"
requires-python = ">=3.12"
dependencies = [
    "strands-agents",
    "bedrock-agentcore",
    "pydantic-settings",
    "httpx",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 は ruff format がコード幅を整えた後、日本語のコメントと docstring にのみ残る。
# 説明文を読みにくく折り返すより、行長チェックはフォーマッタに任せる。
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
